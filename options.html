<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eternal Clipboard Settings</title>
  <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="options.css">
</head>
<body class="options-page">
  <main class="container options-shell py-4 py-md-5">
    <header class="page-header mb-4">
      <p class="page-eyebrow mb-2">Eternal Clipboard</p>
      <h1 class="h3 mb-0">Saved insertables</h1>
    </header>

    <section class="editor-surface" aria-label="Saved insertables">
      <div class="editor-toolbar d-flex justify-content-end p-3">
        <button id="add" class="btn btn-outline-primary" type="button">Add insertable</button>
      </div>

      <div class="table-responsive">
        <table id="insertables" class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th scope="col" class="key-column">Key</th>
              <th scope="col">Text to insert</th>
              <th scope="col" class="actions-column">Actions</th>
            </tr>
          </thead>
          <tbody id="insertables-body"></tbody>
        </table>
      </div>

      <footer class="editor-footer d-flex justify-content-end p-3">
        <button id="save" class="btn btn-primary" type="button">Save changes</button>
      </footer>
    </section>
  </main>

  <div id="snackbar" class="snackbar" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="options.js"></script>
</body>
</html>
